name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate Android project
        shell: bash
        run: |
          base64 -d project.zip.b64 > project.zip
          unzip -q project.zip

      - name: Build debug APK
        working-directory: PescaLuceAlarm
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        shell: bash
        run: |
          cp PescaLuceAlarm/app/build/outputs/apk/debug/app-debug.apk PescaLuceAlarm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PescaLuceAlarm-APK
          path: PescaLuceAlarm.apk
          if-no-files-found: error
